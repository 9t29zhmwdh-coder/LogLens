name: Release

# Baut die Tauri-App bei jedem Tag-Push fuer macOS, Windows und Ubuntu/Linux
# (siehe Platform-Badge im README) und haengt die Bundles (DMG / NSIS-Installer /
# deb+AppImage) an ein GitHub Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    env:
      DATABASE_URL: sqlite:./ci_check.db
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite

      - name: Prepare database
        run: |
          sqlx database create
          sqlx migrate run --source crates/ll-core/src/db/migrations

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LogLens ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details. Not code-signed/notarized: macOS Gatekeeper and Windows SmartScreen will show warnings on first run.'
          releaseDraft: false
          prerelease: false

      - name: Upload stable-named DMG (for README download link)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$dmg" LogLens.dmg
          gh release upload "${{ github.ref_name }}" LogLens.dmg --clobber --repo ${{ github.repository }}

      - name: Upload stable-named installer (for README download link)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "LogLens-Setup.exe"
          gh release upload "${{ github.ref_name }}" "LogLens-Setup.exe" --clobber --repo ${{ github.repository }}

      - name: Upload stable-named AppImage (for README download link)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          cp "$appimage" LogLens.AppImage
          gh release upload "${{ github.ref_name }}" LogLens.AppImage --clobber --repo ${{ github.repository }}
